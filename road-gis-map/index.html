<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>関東甲信地域 業務支援マップ（AI再現版）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --blue: #1a73e8;    /* 国道 */
    --green: #188038;   /* 県道 */
    --orange: #f9ab00;  /* 市道 */
    --purple: #7b1fa2;  /* 高速道路 */
    --gray: #5f6368;
    --panel-bg: #ffffff;
    --border: #dadce0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }

  /* ---- 検索ボックス ---- */
  #searchBox {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    width: 340px; max-width: calc(100vw - 24px);
    background: var(--panel-bg); border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    display: flex; align-items: center; padding: 4px 8px;
  }
  #searchBox input { flex: 1; border: none; outline: none; font-size: 15px; padding: 8px; background: transparent; }
  #searchBox button { border: none; background: none; cursor: pointer; font-size: 16px; color: var(--gray); padding: 6px 8px; }
  #searchResults {
    position: absolute; top: 58px; left: 12px; z-index: 1000;
    width: 340px; max-width: calc(100vw - 24px);
    background: var(--panel-bg); border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25); overflow: hidden;
  }
  #searchResults div { padding: 10px 14px; font-size: 13px; cursor: pointer; border-top: 1px solid #f1f3f4; }
  #searchResults div:hover { background: #f8f9fa; }

  /* ---- サイドパネル ---- */
  #panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    width: 310px; max-width: calc(100vw - 24px);
    max-height: calc(100% - 24px);
    background: var(--panel-bg); border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #panel header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  #panel header h1 { font-size: 15px; margin: 0; }
  #panel header small { display: block; color: var(--gray); font-size: 11px; font-weight: normal; margin-top: 2px; }
  #panelBody { overflow-y: auto; padding: 8px 16px 16px; }
  #panelToggle { border: none; background: none; cursor: pointer; font-size: 14px; color: var(--gray); }
  .section-title { font-size: 12px; color: var(--gray); margin: 14px 0 6px; font-weight: bold; }
  select#branchSelect {
    width: 100%; font-size: 14px; padding: 8px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff;
  }
  .layer-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; cursor: pointer; }
  .layer-row .swatch { width: 22px; height: 5px; border-radius: 3px; flex-shrink: 0; }
  .layer-row .box { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; opacity: .7; }
  .layer-row .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.5); }
  .basemap-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .basemap-row button, .tool-row button {
    flex: 1; min-width: 60px; font-size: 12px; padding: 6px 4px; cursor: pointer;
    border: 1px solid var(--border); background: #fff; border-radius: 6px;
  }
  .basemap-row button.active { background: #e8f0fe; border-color: var(--blue); color: var(--blue); font-weight: bold; }
  .tool-row { display: flex; gap: 6px; margin-top: 4px; }
  .tool-row button.active { background: #fce8e6; border-color: #d93025; color: #d93025; }
  #note {
    margin-top: 14px; font-size: 11px; color: var(--gray);
    background: #fef7e0; border: 1px solid #f9e5a8; border-radius: 6px; padding: 8px 10px; line-height: 1.6;
  }
  #measureInfo {
    display: none; position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: #202124; color: #fff; font-size: 13px;
    padding: 8px 16px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }

  /* ---- ポップアップ ---- */
  .leaflet-popup-content { font-size: 13px; line-height: 1.6; margin: 12px 16px; }
  .popup-title { font-size: 15px; font-weight: bold; margin-bottom: 2px; }
  .popup-sub { color: var(--gray); font-size: 12px; margin-bottom: 8px; }
  .popup-table { border-collapse: collapse; width: 100%; }
  .popup-table th, .popup-table td { text-align: left; padding: 3px 6px 3px 0; vertical-align: top; font-size: 12px; }
  .popup-table th { color: var(--gray); white-space: nowrap; font-weight: normal; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; color: #fff; }
  .sample-note { margin-top: 6px; color: #d93025; font-size: 11px; }

  @media (max-width: 640px) { #panel { top: auto; bottom: 12px; max-height: 50%; } }
</style>
</head>
<body>
<div id="map"></div>

<div id="searchBox">
  <input id="searchInput" type="text" placeholder="住所・地名で検索（例：長野市）" autocomplete="off">
  <button id="searchBtn" title="検索">&#128269;</button>
</div>
<div id="searchResults" hidden></div>

<div id="panel">
  <header>
    <div>
      <h1>関東甲信地域 業務支援マップ</h1>
      <small>道路許認可支援業務用GISマップ（AI再現版・サンプルデータ）</small>
    </div>
    <button id="panelToggle" title="開閉">▲</button>
  </header>
  <div id="panelBody">
    <div class="section-title">支店の選択</div>
    <select id="branchSelect">
      <option value="all">全支店（関東甲信 一都八県）</option>
    </select>

    <div class="section-title">表示レイヤー</div>
    <label class="layer-row"><input type="checkbox" data-layer="muni" checked><span class="box" style="background:#9e9e9e"></span>市町村界</label>
    <label class="layer-row"><input type="checkbox" data-layer="did" checked><span class="box" style="background:#e91e63"></span>DID区域（人口集中地区）</label>
    <label class="layer-row"><input type="checkbox" data-layer="kokudo" checked><span class="swatch" style="background:var(--blue)"></span>主要道路：国道</label>
    <label class="layer-row"><input type="checkbox" data-layer="kendo" checked><span class="swatch" style="background:var(--green)"></span>主要道路：県道</label>
    <label class="layer-row"><input type="checkbox" data-layer="shido" checked><span class="swatch" style="background:var(--orange)"></span>主要道路：市道</label>
    <label class="layer-row"><input type="checkbox" data-layer="highway" checked><span class="swatch" style="background:var(--purple)"></span>高速道路</label>
    <label class="layer-row"><input type="checkbox" data-layer="police" checked><span class="dot" style="background:#3949ab"></span>公共施設：警察署</label>
    <label class="layer-row"><input type="checkbox" data-layer="michinoeki" checked><span class="dot" style="background:#00897b"></span>公共施設：道の駅</label>
    <label class="layer-row"><input type="checkbox" data-layer="kankatsu" checked><span class="dot" style="background:#1a73e8"></span>管轄情報：国道事務所ほか</label>
    <label class="layer-row"><input type="checkbox" data-layer="kyudo" checked><span class="swatch" style="background:#616161"></span>管轄情報：旧国道18号（旧道）</label>

    <div class="section-title">ベースマップ</div>
    <div class="basemap-row">
      <button data-base="std" class="active">標準</button>
      <button data-base="pale">淡色</button>
      <button data-base="photo">写真</button>
      <button data-base="osm">OSM</button>
    </div>

    <div class="section-title">ツール</div>
    <div class="tool-row">
      <button id="measureBtn">距離計測</button>
      <button id="kmlBtn">KML書出</button>
    </div>
    <div class="tool-row">
      <button id="importBtn">GeoJSON読込</button>
      <button id="locateBtn">現在地</button>
    </div>
    <input type="file" id="importFile" accept=".geojson,.json" hidden>

    <div id="note">
      ⚠️ 表示中のデータは<strong>デモ用サンプル</strong>です（区域・線形・位置は概略）。実運用時は国土数値情報（行政区域／DID／道路／高速道路／警察署／道の駅）や道路台帳等の実データに差し替えてください。「KML書出」で表示中データをGoogle Earth用KMLとして保存できます（実物と同じ納品形式）。
    </div>
  </div>
</div>

<div id="measureInfo"></div>

// ============================================================
// レイヤ生成（支店フィルタ対応）
// ============================================================
const groups = {};
['muni','did','kokudo','kendo','shido','highway','police','michinoeki','kankatsu','kyudo']
  .forEach(k => { groups[k] = L.layerGroup().addTo(map); });

const ROAD_STYLE = {
  kokudo: { color: '#1a73e8', weight: 5, label: '国道（直轄）' },
  kendo:  { color: '#188038', weight: 4, label: '県道' },
  shido:  { color: '#f9ab00', weight: 4, label: '市道' }
};

let currentBranch = 'all';

function visible(prefs) {
  if (currentBranch === 'all') return true;
  return prefs.includes(BRANCHES[currentBranch].pref);
}

function tbl(rows) {
  return '<table class="popup-table">' + rows.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('') + '</table>';
}
const SAMPLE = '<div class="sample-note">※ サンプルデータ（形状・位置は概略）</div>';

function rebuildLayers() {
  Object.values(groups).forEach(g => g.clearLayers());

  MUNI.filter(m => visible(m.prefs)).forEach(m => {
    L.polygon(m.coords, { color: '#757575', weight: 2, dashArray: '4 3', fillColor: '#9e9e9e', fillOpacity: 0.08 })
      .bindPopup(`<div class="popup-title">${m.name}</div><div class="popup-sub">市町村界</div>${SAMPLE}`)
      .addTo(groups.muni);
  });

  DID.filter(d => visible(d.prefs)).forEach(d => {
    L.polygon(d.coords, { color: '#e91e63', weight: 1, fillColor: '#e91e63', fillOpacity: 0.18 })
      .bindPopup(`<div class="popup-title">${d.name}</div><div class="popup-sub">DID区域（2020年 人口集中地区）</div>${SAMPLE}`)
      .addTo(groups.did);
  });

  ROADS.filter(r => visible(r.prefs)).forEach(r => {
    const s = ROAD_STYLE[r.cat];
    L.polyline(r.coords, { color: '#ffffff', weight: s.weight + 4, opacity: 0.9 }).addTo(groups[r.cat]);
    const line = L.polyline(r.coords, { color: s.color, weight: s.weight, opacity: 0.95 });
    const rows = [['区間', r.section], ['道路管理者・窓口', r.office], ...PERMITS[r.cat]];
    line.bindPopup(`<div class="popup-title">${r.name}</div>
      <div class="popup-sub"><span class="badge" style="background:${s.color}">${s.label}</span></div>${tbl(rows)}${SAMPLE}`, { maxWidth: 320 });
    line.on('mouseover', () => line.setStyle({ weight: s.weight + 3 }));
    line.on('mouseout',  () => line.setStyle({ weight: s.weight }));
    line.addTo(groups[r.cat]);
  });

  HIGHWAYS.filter(h => visible(h.prefs)).forEach(h => {
    L.polyline(h.coords, { color: '#ffffff', weight: 9, opacity: 0.9 }).addTo(groups.highway);
    L.polyline(h.coords, { color: '#7b1fa2', weight: 5, opacity: 0.9 })
      .bindPopup(`<div class="popup-title">${h.name}</div>
        <div class="popup-sub"><span class="badge" style="background:#7b1fa2">高速道路</span></div>
        ${tbl([['区間', h.section], ['管理者', h.operator]])}${SAMPLE}`, { maxWidth: 320 })
      .addTo(groups.highway);
  });

  POLICE.filter(p => visible(p.prefs)).forEach(p => {
    L.circleMarker([p.lat, p.lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#3949ab', fillOpacity: 1 })

      .bindTooltip(p.name, { direction: 'top', offset: [0, -6] })
      .addTo(groups.police);
  });

  MICHINOEKI.filter(m => visible(m.prefs)).forEach(m => {
    L.circleMarker([m.lat, m.lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#00897b', fillOpacity: 1 })

      .bindTooltip(m.name, { direction: 'top', offset: [0, -6] })
      .addTo(groups.michinoeki);
  });

  OFFICES.filter(o => visible(o.prefs)).forEach(o => {
    L.circleMarker([o.lat, o.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#1a73e8', fillOpacity: 1 })
      .bindPopup(`<div class="popup-title">${o.name}</div>
        <div class="popup-sub"><span class="badge" style="background:#1a73e8">国土交通省 関東地方整備局</span></div>
        ${tbl([['主な管轄', o.area], ['窓口業務', '道路占用許可・工事施工承認 等の申請受付']])}${SAMPLE}`, { maxWidth: 320 })
      .bindTooltip(o.name, { direction: 'top', offset: [0, -6] })
      .addTo(groups.kankatsu);
  });

  KYUDO.filter(k => visible(k.prefs)).forEach(k => {
    L.polyline(k.coords, { color: '#616161', weight: 4, dashArray: '8 6', opacity: 0.9 })
      .bindPopup(`<div class="popup-title">${k.name}</div>

        ${tbl([['区間', k.section]])}${SAMPLE}`, { maxWidth: 320 })

  });
}

// ============================================================
// 住所検索（国土地理院ジオコーディングAPI）
// ============================================================
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchMarker = null;

async function doSearch() {
  const q = searchInput.value.trim();
  if (!q) return;
  searchResults.innerHTML = '<div>検索中…</div>';
  searchResults.hidden = false;
  try {
    const res = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q));
    const data = await res.json();
    if (!data.length) { searchResults.innerHTML = '<div>該当なし</div>'; return; }
    searchResults.innerHTML = '';
    data.slice(0, 8).forEach(f => {
      const div = document.createElement('div');
      div.textContent = f.properties.title;
      div.addEventListener('click', () => {
        const [lng, lat] = f.geometry.coordinates;
        if (searchMarker) map.removeLayer(searchMarker);
        searchMarker = L.marker([lat, lng]).addTo(map).bindPopup(f.properties.title).openPopup();
        map.setView([lat, lng], 14);
        searchResults.hidden = true;
      });
      searchResults.appendChild(div);
    });
  } catch (err) {
    searchResults.innerHTML = '<div>検索に失敗しました（ネットワークをご確認ください）</div>';
  }
}
document.getElementById('searchBtn').addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
map.on('click', () => { searchResults.hidden = true; });

// ============================================================
// 距離計測
// ============================================================
const measureBtn = document.getElementById('measureBtn');
const measureInfo = document.getElementById('measureInfo');
let measuring = false, measurePts = [], measureLayer = L.layerGroup().addTo(map);

function fmtKm(m) { return m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m'; }

function updateMeasure() {
  measureLayer.clearLayers();
  let total = 0;
  measurePts.forEach((p, i) => {
    L.circleMarker(p, { radius: 4, color: '#d93025', fillColor: '#fff', fillOpacity: 1, weight: 2 }).addTo(measureLayer);
    if (i > 0) total += map.distance(measurePts[i - 1], p);
  });
  if (measurePts.length > 1) L.polyline(measurePts, { color: '#d93025', weight: 3, dashArray: '6 4' }).addTo(measureLayer);
  measureInfo.textContent = measurePts.length < 2 ? '地図をクリックして計測（ダブルクリックで終了）' : '合計距離：' + fmtKm(total);
}

function stopMeasure() {
  measuring = false;
  measureBtn.classList.remove('active');
  measureInfo.style.display = 'none';
  map.getContainer().style.cursor = '';
  map.off('click', onMeasureClick);
  map.off('dblclick', stopMeasure);
  map.doubleClickZoom.enable();
}

function onMeasureClick(e) { measurePts.push(e.latlng); updateMeasure(); }

measureBtn.addEventListener('click', () => {
  if (measuring) { stopMeasure(); return; }
  measuring = true;
  measurePts = [];
  measureLayer.clearLayers();
  measureBtn.classList.add('active');
  measureInfo.style.display = 'block';
  measureInfo.textContent = '地図をクリックして計測（ダブルクリックで終了）';
  map.getContainer().style.cursor = 'crosshair';
  map.doubleClickZoom.disable();
  map.on('click', onMeasureClick);
  map.on('dblclick', stopMeasure);
});

// ============================================================
// KML書き出し（Google Earth互換 — 実物と同じ納品形式）
// ============================================================
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function kmlCoords(coords) { return coords.map(c => `${c[1]},${c[0]},0`).join(' '); }

function buildKml() {
  const branchName = currentBranch === 'all' ? '関東甲信 全支店' : BRANCHES[currentBranch].name;
  const parts = [];
  parts.push(`<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>${esc('業務支援マップ（' + branchName + '）サンプル')}</name>
<Style id="kokudo"><LineStyle><color>ffe8731a</color><width>4</width></LineStyle></Style>
<Style id="kendo"><LineStyle><color>ff388018</color><width>3</width></LineStyle></Style>
<Style id="shido"><LineStyle><color>ff00abf9</color><width>3</width></LineStyle></Style>
<Style id="highway"><LineStyle><color>ffa21f7b</color><width>4</width></LineStyle></Style>
<Style id="kyudo"><LineStyle><color>ff616161</color><width>3</width></LineStyle></Style>
<Style id="muni"><LineStyle><color>ff757575</color><width>2</width></LineStyle><PolyStyle><color>1a9e9e9e</color></PolyStyle></Style>
<Style id="did"><LineStyle><color>ff6339e9</color><width>1</width></LineStyle><PolyStyle><color>336339e9</color></PolyStyle></Style>`);

  function folder(name, items) {
    if (!items.length) return '';
    return `<Folder><name>${esc(name)}</name>${items.join('')}</Folder>`;
  }
  function lineMark(name, desc, style, coords) {
    return `<Placemark><name>${esc(name)}</name><description>${esc(desc)}</description><styleUrl>#${style}</styleUrl><LineString><tessellate>1</tessellate><coordinates>${kmlCoords(coords)}</coordinates></LineString></Placemark>`;
  }
  function polyMark(name, desc, style, coords) {
    const ring = kmlCoords(coords.concat([coords[0]]));
    return `<Placemark><name>${esc(name)}</name><description>${esc(desc)}</description><styleUrl>#${style}</styleUrl><Polygon><outerBoundaryIs><LinearRing><coordinates>${ring}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`;
  }
  function pointMark(name, desc, lat, lng) {
    return `<Placemark><name>${esc(name)}</name><description>${esc(desc)}</description><Point><coordinates>${lng},${lat},0</coordinates></Point></Placemark>`;
  }

  parts.push(folder('市町村界', MUNI.filter(m => visible(m.prefs)).map(m => polyMark(m.name, 'サンプル（概形）', 'muni', m.coords))));
  parts.push(folder('DID区域（2020年）', DID.filter(d => visible(d.prefs)).map(d => polyMark(d.name, 'サンプル（概形）', 'did', d.coords))));
  parts.push(folder('主要道路（国・県・市道）', ROADS.filter(r => visible(r.prefs)).map(r =>
    lineMark(r.name, `区間: ${r.section} / 管理者・窓口: ${r.office}（サンプル）`, r.cat, r.coords))));
  parts.push(folder('高速道路', HIGHWAYS.filter(h => visible(h.prefs)).map(h =>
    lineMark(h.name, `区間: ${h.section} / 管理者: ${h.operator}（サンプル）`, 'highway', h.coords))));
  parts.push(folder('公共施設（警察署）', POLICE.filter(p => visible(p.prefs)).map(p => pointMark(p.name, '警察署（サンプル・位置概略）', p.lat, p.lng))));
  parts.push(folder('公共施設（道の駅）', MICHINOEKI.filter(m => visible(m.prefs)).map(m => pointMark(m.name, '道の駅（サンプル・位置概略）', m.lat, m.lng))));
  parts.push(folder('管轄情報（国道事務所）', OFFICES.filter(o => visible(o.prefs)).map(o => pointMark(o.name, `主な管轄: ${o.area}（サンプル・位置概略）`, o.lat, o.lng))));
  parts.push(folder('管轄情報（旧国道18号）', KYUDO.filter(k => visible(k.prefs)).map(k => lineMark(k.name, `区間: ${k.section}（サンプル）`, 'kyudo', k.coords))));

  parts.push('</Document></kml>');
  return parts.join('\n');
}

document.getElementById('kmlBtn').addEventListener('click', () => {
  const blob = new Blob([buildKml()], { type: 'application/vnd.google-earth.kml+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '業務支援マップ_サンプル.kml';
  a.click();
  URL.revokeObjectURL(a.href);
});

// ============================================================
// GeoJSON読込（実データの重ね合わせ用）
// ============================================================
const importFile = document.getElementById('importFile');
document.getElementById('importBtn').addEventListener('click', () => importFile.click());
importFile.addEventListener('change', () => {
  const file = importFile.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const gj = JSON.parse(reader.result);
      const layer = L.geoJSON(gj, {
        style: { color: '#9334e6', weight: 4 },
        pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 6, color: '#fff', weight: 2, fillColor: '#9334e6', fillOpacity: 1 }),
        onEachFeature: (f, l) => {
          const props = f.properties || {};
          const rows = Object.entries(props).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
          l.bindPopup(`<table class="popup-table">${rows || '<tr><td>属性なし</td></tr>'}</table>`, { maxWidth: 320 });
        }
      }).addTo(map);
      if (layer.getBounds().isValid()) map.fitBounds(layer.getBounds());
    } catch (err) {
      alert('GeoJSONの読み込みに失敗しました：' + err.message);
    }
    importFile.value = '';
  };
  reader.readAsText(file);
});
